name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend QA
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: hcms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, zip
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: QA
        run: composer qa
        env:
          CMS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=hcms_test
          CMS_TEST_DB_USER: root
          CMS_TEST_DB_PASS: ''

  frontend:
    name: Frontend QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: QA
        run: npm run qa

  release:
    name: Release dry-run
    # Runs on every change: building the zip is the only place where the
    # installable tree (vendor depth, autoload, admin assets) gets verified.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, zip
          coverage: none
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build release zip (no publish)
        run: bash scripts/release.sh
        env:
          PUBLISH: '0'
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cms-release
          path: |
            dist/cms-*.zip
            dist/cms-*.zip.sha256
            dist/latest.json
