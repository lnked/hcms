services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8080
      APP_SECRET: docker-dev-secret-change-me
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: hcms
      DB_USERNAME: hcms
      DB_PASSWORD: hcms
      DB_CHARSET: utf8mb4
      CMS_GITHUB_REPO: lnked/hcms
      CMS_PUBLIC_DIR: public
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hcms
      MYSQL_USER: hcms
      MYSQL_PASSWORD: hcms
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - hcms_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  hcms_mysql:
